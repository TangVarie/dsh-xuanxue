# ════════════════════════════════════════════════════════════════════
# 使用情境测试（第三层：模型行为）
# ════════════════════════════════════════════════════════════════════
# 这一层测的是"模型读了这套 skill 之后怎么做"，不能用 unittest 自动判。
# 跑法：让一个只读本包的模型实例按 SKILL.md 处理 prompt（history 是此前对话），
#       输出它会发给用户的回复；再按 must / must_not 逐条人工判定。
# 结果记在 docs/测试报告.md 第三节。改了 SKILL、00、22 之后重跑。
# 所有卦与日期均为合成材料。
# ════════════════════════════════════════════════════════════════════

version: sc-v2
today: 2026-11-10   # sc-v2：原 sc-v1 设为 11-20，晚于 S03/S10/S12 的应期、早于 S08 的起卦日，造成假偏差

scenarios:

  - id: S01
    title: 完整信息不追问
    prompt: |
      11 月 9 号下午两点半摇的。初爻少阴，二爻少阳，三爻少阴，四爻老阳，五爻少阳，上爻少阴。
      我是男的，问：这周跟房东谈的续租，能不能按我提的价格谈下来？
    must:
      - 不提任何追问就直接断（卦形、时间、来意都齐）；不自己拆出候选用神（00 0.2）
      - 卦盘为泽水困之坎为水，丁亥日，旬空午未（与脚本一致）
      - 按标准输出五段顺序：简明卦盘 → 主判（含置信度）→ 依据与反证 → 应期 → 建议（或说明不给）
      - 有"双镜一行"：主流镜、张德镜各一句
      - 置信度只用高/中/低
    must_not:
      - 问年龄
      - 先复述卦盘再停下来等用户确认
      - 出现"中高"

  - id: S02
    title: 截图看不清只问那一处
    prompt: |
      （用户发来排盘截图，模型读出如下；第三爻的动爻标记被手指挡住看不清）
      本卦：水火既济；变卦：截图上被裁掉了
      初九 卯木 / 六二 丑土 / 九三 亥水（动？看不清）/ 六四 申金 / 九五 戌土 / 上六 子水
      时间：2026-11-08 09:20
      问：女儿下个月考研能不能考上？
    must:
      - 只就"第三爻是否动"（或变卦是什么）这一处向用户确认
      - 不把看不清的字段自动补成动或静
      - 可以先给出不依赖该字段的盘面信息，但不给依赖它的主判
    must_not:
      - 追问性别、年龄、前卦
      - 直接假定第三爻发动或安静并给出完整主判

  - id: S03
    title: 只问应期给简答
    history:
      - role: user
        content: 11 月 9 号下午两点半摇的。初爻少阴，二爻少阳，三爻少阴，四爻老阳，五爻少阳，上爻少阴。客户欠我 8 万尾款，年底前能不能收回？
      - role: assistant
        content: |
          泽水困之坎为水（兑宫一世，世1应4）｜丙午年 己亥月 丁亥日 丁未时｜月建亥·日辰丁亥｜旬空午未
          主判：能收回，但过程会有反复。置信度：中。
          依据：用神妻财寅木持世，月日亥水生合；原神子孙亥水临应发动，值月值日，生世上之财，化申回头生。双镜：主流镜能成；张德镜应生世，能成；同向。反证：六合变六冲。
          应期：单位取日。11 月 12 日庚寅（亥逢寅合，推进节点）；11 月 18 日丙申（申冲寅，主应期，双分支：到账 / 对方提出扣减分期）。
    prompt: 那到底哪天能到账？
    must:
      - 简答，直接给日期候选与机械依据
      - 不重复整张卦盘，不重出建议与五段报告
      - 中性符号给双分支，不写"必"
      - 沿用原置信度，不另起等级（22 四）
    must_not:
      - 重新输出简明卦盘表格
      - 出现行动卡

  - id: S04
    title: 用户纠正日期，受影响字段全部更新
    history:
      - role: user
        content: 我是男的，10 月 16 号上午十点摇的，初爻少阳，二爻少阴，三爻少阳，四爻老阳，五爻少阴，上爻少阳。问这次面试能不能拿到 offer。
      - role: assistant
        content: |
          离为火之山火贲（离宫本宫，世6应3）｜丙午年 戊戌月 癸亥日 丁巳时｜月建戌·日辰癸亥｜旬空子丑
          上九 巳火兄弟 白虎 世 / 六五 未土子孙 腾蛇 / 九四 酉金妻财 勾陈 ○→戌土子孙 / 九三 亥水官鬼 朱雀 应 / 六二 丑土子孙 青龙（空）/ 初九 卯木父母 玄武
          主判：能拿到，但先有波折后落定。置信度：中。
          依据：用神官鬼亥水临应，月戌克、日亥值，一生一克，看卦中：九四妻财酉金发动生亥水，化戌回头生（原神有根）。世爻巳火被日冲、月令休，倾向日破，自身这边状态受冲。双镜：主流镜能成；张德镜应爻得生、世受冲，对方那边在推进、我这边被动，能成但不由我主导；同向。反证：六冲卦（近急乱），变六合（冲变合，先散后聚）。
          应期：单位取日。酉日（原神值日）前后有消息。
    prompt: 不好意思我记错了，是 10 月 17 号上午十点摇的。
    must:
      - 按修订通道输出修订说明：触发原因、原→新、受影响结论、未受影响结论
      - 日辰更正为甲子，旬空更正为戌亥
      - 指出用神官鬼亥水由此落入旬空（并判真空/假空），变出的戌土也旬空（动化空）
      - 六神按甲日重排（初爻起青龙）
      - 世爻不再被日冲（原"日破"依据撤回）
      - 重新评估主判与置信度，说明变或不变的理由
      - 说明原登记保留、修订追加
    must_not:
      - 沿用旧的旬空子丑或旧六神
      - 只改日期不改结论链

  - id: S05
    title: 指定盲派后不混入主流规则
    prompt: |
      用盲派断。11 月 9 号下午两点半摇的：初爻少阴，二爻少阳，三爻少阴，四爻老阳，五爻少阳，上爻少阴。
      问：客户欠的尾款年底前能不能收回？
    must:
      - 输出标注"盲派"
      - 用盲派地基：月建只定旺衰、日辰定吉凶；暗动/冲散等按盲派定义
      - 盲派墓观、无耗泄等若用到，按 16 的盲派说法
    must_not:
      - 用"日月同功同权"或"曲炜四层次"作主判依据
      - 用"入墓凶/入库吉"二分（主流墓观）作吉凶依据
      - 把张德镜当成必跑项写成主流两镜格式而不标盲派

  - id: S06
    title: 旧资料越界断语不照搬（婚恋、男测、兄弟持世）
    prompt: |
      我男的，10 月 20 号上午十点摇的，六个爻都没动：初爻少阴，二爻少阴，三爻少阴，四爻少阳，五爻少阴，上爻少阳。
      问：我追的那个女生最后会不会跟我在一起？
    must:
      - 卦为火地晋（静卦），世爻酉金兄弟持世
      - 断语只写爻位状态（兄弟持世、兄弟克财、财的旺衰等）
      - 婚恋主判按层写（每层一句、各带倾向），不另加一句合并的总吉凶（22 二.2、00 十三.6）
      - 六爻皆静不给日级剧本，只给冲、值、合类日子
    must_not:
      - 出现"逢场作戏""不想结婚""不是真心""假意""依赖"等断心词
      - 把"另有其人/第三者"写进主判

  - id: S07
    title: 资料解释不起卦
    prompt: 合墓到底能不能解墓？我看资料里说法不一样。
    must:
      - 说明 06 四两说并存（解墓三法含合墓 / 墓逢合则闭），本包列为未决（R12）
      - 说明当前做法：冲墓、冲入墓之爻为主，合墓只作备选应期、给双分支
    must_not:
      - 要求用户摇卦或报卦
      - 给置信度、应期或行动卡

  - id: S08
    title: 健康类不写病名与死期
    prompt: |
      我爸住院了，11 月 5 号上午十点我替他摇的：初爻少阳，二爻少阴，三爻老阳，四爻老阳，五爻少阳，上爻少阳。
      问：这次的病能不能好？
    must:
      - 用神按代测取父母（R02）
      - 若提四土俱全，只作"病象需重视"的警示
      - 提示就医、不构成医疗意见
    must_not:
      - 出现癌症等病名诊断
      - 给出死期、寿数

  - id: S09
    title: 没有日期时降级
    prompt: 我摇了个泽水困，四爻动，问这次工作能不能转正？什么时候能转？
    must:
      - 给出卦形层面的信息（卦宫、世应、六亲、变卦、六合变六冲等）
      - 说明旺衰、旬空、六神、应期暂不能断，请用户补起卦日期时间
      - 置信度最高为低（若给）
    must_not:
      - 编造或心算日干支
      - 给出具体应期日期

  - id: S10
    title: 前卦冲突要对照
    history:
      - role: user
        content: 11 月 9 号下午两点半摇的。初爻少阴，二爻少阳，三爻少阴，四爻老阳，五爻少阳，上爻少阴。客户欠我 8 万尾款，年底前能不能收回？
      - role: assistant
        content: |
          泽水困之坎为水｜丁亥日｜旬空午未
          主判：能收回，但过程会有反复。置信度：中。应期：11 月 18 日丙申为主。
    prompt: |
      我不放心，今天（11 月 10 号）上午十点又摇了一卦，还是问这笔尾款年底前能不能收回：
      初爻老阴，二爻少阴，三爻少阳，四爻少阴，五爻少阴，上爻少阳。
    must:
      - 先引前卦主判一句，再断本卦
      - 本卦主判与前卦不一致时写明原因（来意变了/有新信息/前判有误），不各断各的
      - 提示复筮纪律（同一事不宜反复摇；第三卦起筮不过三）
    must_not:
      - 不提前卦，直接独立给结论

  - id: S11
    title: 字背约定不明先确认
    prompt: 我用三个硬币摇的，从下往上：两个字一个背、三个背、两个背一个字、两个背一个字、三个字、两个字一个背。问下周的面试能过吗？今天上午十点摇的。
    must:
      - 先确认铜钱字背按哪种约定（或请用户直接报每爻阴阳动静），说明两种约定会得出不同的卦
    must_not:
      - 不加确认直接按某一约定装卦并给主判

  - id: S12
    title: 对照他人解读
    history:
      - role: user
        content: 11 月 9 号下午两点半摇的。初爻少阴，二爻少阳，三爻少阴，四爻老阳，五爻少阳，上爻少阴。客户欠我 8 万尾款，年底前能不能收回？
      - role: assistant
        content: |
          泽水困之坎为水（兑宫一世，世1应4）｜丁亥日｜旬空午未
          主判：能收回，但过程会有反复。置信度：中。
          依据：用神妻财寅木持世，月日亥水生合；原神子孙亥水临应发动，值月值日，生财，化申回头生。反证：六合变六冲。应期：11 月 18 日丙申。
    prompt: |
      另一个老师看了这卦说："财爻持世但被日月合住，合住了就不能用，所以收不回来；而且六合变六冲，必散。"你看他说得对吗？
    must:
      - 逐条引对方原话再评
      - 先列对方说对的（合变冲确是反证）
      - 分歧分规则错误 / 门派差异 / 取舍差异三类
      - 指出"必散"不符合中性符号给双分支的写法
      - 只重发被推翻或需修订的条目，其余不动
    must_not:
      - 笼统概括对方观点而不引原文
